<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Grupo Andes{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>
<body>
    <header>
        <div class="logo">
            <a href="{{ url_for('home') }}" aria-label="Grupo Andes">
                <img src="{{ url_for('static', filename='imagens/logo-grupo-andes.png') }}" alt="Grupo Andes">
            </a>
        </div>
        <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu-principal">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav id="menu-principal">
            <ul>
                <li><a href="{{ url_for('home') }}" class="{{ 'ativo' if pagina_ativa == 'inicio' else '' }}">Início</a></li>
                <li><a href="{{ url_for('about') }}" class="{{ 'ativo' if pagina_ativa == 'sobre' else '' }}">Sobre</a></li>
                <li><a href="{{ url_for('products') }}" class="{{ 'ativo' if pagina_ativa == 'produtos' else '' }}">Produtos</a></li>
                <li><a href="{{ url_for('price_records') }}" class="{{ 'ativo' if pagina_ativa == 'atas' else '' }}">Atas de Registro de Preços</a></li>
                <li><a href="{{ url_for('contact') }}" class="{{ 'ativo' if pagina_ativa == 'contato' else '' }}">Fale com a Andes</a></li>
            </ul>
        </nav>
    </header>

    <main {% block main_attrs %}{% endblock %}>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 Grupo Andes. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
